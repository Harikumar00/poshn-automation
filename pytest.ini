[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml
markers =
    smoke: fast read-only health checks
    regression: broader read-only regression checks
    auth: authentication coverage
    destructive: tests requiring dedicated isolated data (disabled by default)
timeout = 60

