name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q pages components config utils tests conftest.py

      - name: Check patch formatting
        run: git diff --check

  tests:
    name: Playwright and MongoDB tests
    runs-on: ubuntu-latest
    needs: quality
    env:
      HEADLESS: 'true'
      NUCLEUS_BASE_URL: ${{ secrets.NUCLEUS_BASE_URL }}
      NUCLEUS_TEST_PHONE: ${{ secrets.NUCLEUS_TEST_PHONE }}
      NUCLEUS_TEST_OTP: ${{ secrets.NUCLEUS_TEST_OTP }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run application tests
        shell: bash
        run: |
          if [[ -z "$NUCLEUS_TEST_PHONE" || -z "$NUCLEUS_TEST_OTP" ]]; then
            echo "Application secrets are not configured; skipping Playwright tests."
            exit 0
          fi
          pytest -m 'not mongo' -q

      - name: Run read-only MongoDB validation tests
        shell: bash
        run: |
          if [[ -z "$MONGODB_URI" || -z "$MONGODB_DATABASE" ]]; then
            echo "MongoDB secrets are not configured; skipping MongoDB tests."
            exit 0
          fi
          pytest -m mongo tests/mongo -q

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            test-results/
          if-no-files-found: ignore

  cd:
    name: Build and publish Docker test runner
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
